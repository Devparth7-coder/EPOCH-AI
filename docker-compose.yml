services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: epoch
      POSTGRES_PASSWORD: epoch
      POSTGRES_DB: epoch
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epoch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://epoch:epoch@db:5432/epoch
      ENVIRONMENT: local
      CORS_ORIGINS: http://localhost:8000,http://localhost:5173
      BIFROST_API_KEY: ${BIFROST_API_KEY:-}
      BIFROST_BASE_URL: ${BIFROST_BASE_URL:-https://gateway.getbifrost.ai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
